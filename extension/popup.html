<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>VidQuery</title>
  <style>
    :root {
      --bg: #0d1a22;
      --surface: #142833;
      --border: #234455;
      --text: #e3eef3;
      --muted: #93aebc;
      --accent: #45c8df;
      --good: #4ade80;
      --bad: #f87171;
    }

    * { box-sizing: border-box; }

    body {
      width: 290px;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.55 "Roboto", -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--accent);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex: none;
    }
    .dot.ok { background: var(--good); }
    .dot.bad { background: var(--bad); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .kv {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }
    .kv span:first-child { color: var(--muted); }
    .kv span:last-child {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11.5px;
      text-align: right;
      overflow-wrap: anywhere;
    }

    button {
      width: 100%;
      padding: 9px;
      background: var(--accent);
      color: #06202a;
      border: none;
      border-radius: 8px;
      font: 600 13px "Roboto", sans-serif;
      cursor: pointer;
    }
    button:hover { background: #6fd8ea; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .hint {
      font-size: 11.5px;
      color: var(--muted);
      margin: 0;
    }
    code {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 11px;
      background: #0a141a;
      padding: 1px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <h1>VidQuery</h1>

  <div class="row">
    <span class="dot" id="server-dot"></span>
    <span id="server-status">Checking server&hellip;</span>
  </div>

  <div class="card" id="server-card" hidden>
    <div class="kv"><span>Model</span><span id="v-model">&mdash;</span></div>
    <div class="kv"><span>Embeddings</span><span id="v-embed">&mdash;</span></div>
    <div class="kv"><span>Speech</span><span id="v-asr">&mdash;</span></div>
    <div class="kv"><span>Visual OCR</span><span id="v-visual">&mdash;</span></div>
  </div>

  <div id="on-youtube" hidden>
    <button id="toggle-btn" type="button">Show / hide panel</button>
  </div>

  <p class="hint" id="off-youtube" hidden>
    Open a YouTube video to use VidQuery.
  </p>

  <p class="hint" id="server-hint" hidden>
    Start the backend:<br />
    <code>cd backend</code><br />
    <code>.venv\Scripts\uvicorn main:app --port 8000</code>
  </p>

  <script src="popup.js"></script>
</body>
</html>
