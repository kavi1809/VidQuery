<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VidQuery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 280px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
    }

    .header {
      padding: 16px;
      background: #0d1424;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
    }
    .tagline {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .body { padding: 16px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex-shrink: 0;
    }
    .dot.offline { background: #ef4444; }
    .status-text { font-size: 12px; color: #94a3b8; }

    .toggle-btn {
      width: 100%;
      padding: 10px;
      background: #38bdf8;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      transition: background 0.15s;
    }
    .toggle-btn:hover { background: #7dd3fc; }

    .info-box {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .info-box b { color: #e2e8f0; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #1e293b;
      font-size: 11px;
      color: #334155;
      text-align: center;
    }

    #not-youtube {
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 13px;
    }
    #not-youtube span { font-size: 28px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡ VidQuery</div>
    <div class="tagline">AI-powered YouTube Q&A</div>
  </div>

  <div id="main-content">
    <div class="body">
      <div class="status-row">
        <div class="dot" id="server-dot"></div>
        <div class="status-text" id="server-status">Checking server...</div>
      </div>

      <button class="toggle-btn" id="toggle-btn">
        Show / Hide Sidebar
      </button>

      <div class="info-box">
        <b>How to use:</b><br>
        1. Open any YouTube video<br>
        2. The sidebar auto-opens<br>
        3. Wait for indexing (~5 sec)<br>
        4. Ask any question about it!
      </div>
    </div>
  </div>

  <div id="not-youtube" style="display:none">
    <span>🎬</span>
    Navigate to a YouTube video<br>to use VidQuery
  </div>

  <div class="footer">VidQuery v1.0 — Final Year Project</div>

  <script src="popup.js"></script>
</body>
</html>
